[project]
name = "yuzme-ai-asistani"
version = "0.1.0"
description = "Kisisellestirilmis yapay zeka yuzme asistani backend cekirdegi"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1.0",
  "uvicorn[standard]>=0.35,<1.0",
  "gunicorn>=23,<24",
  "pydantic>=2.11,<3.0",
  "pydantic-settings>=2.10,<3.0",
  "langgraph>=0.6,<2.0",
  "langchain-core>=0.3,<2.0",
  "redis>=5.0,<8.0",
  "slowapi>=0.1.9,<1.0",
  "httpx>=0.28,<1.0",
  "psutil>=6.0,<8.0",
  "sqlalchemy>=2.0,<3.0",
  "asyncpg>=0.29,<1.0",
  "alembic>=1.14,<2.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.4,<9.0",
  "pytest-asyncio>=1.1,<2.0",
  "httpx>=0.28,<1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
